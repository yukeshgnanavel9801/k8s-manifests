
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capstone-viewer
  namespace: capstone
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capstone-read-only
  namespace: capstone
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capstone-viewer-binding
  namespace: capstone
subjects:
  - kind: ServiceAccount
    name: capstone-viewer
    namespace: capstone
roleRef:
  kind: Role
  name: capstone-read-only
  apiGroup: rbac.authorization.k8s.io
