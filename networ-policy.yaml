
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capstone-app-policy
  namespace: capstone
spec:
  podSelector:
    matchLabels:
      app: capstone-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
